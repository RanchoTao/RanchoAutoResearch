project:
  name: "jev-system-one-research-map-v0.1"
  mode: "semi-auto"

research:
  topic: "Typed Probabilistic System-One Decision Models: Calibration, Invariance, Composition, and Adaptive Routing"
  domains:
    - "machine learning"
    - "large language models"
    - "uncertainty calibration"
    - "selective prediction"
    - "conformal risk control"
    - "LLM routing"
    - "LLM evaluation"
    - "structured prediction"
    - "AI systems"
  daily_paper_count: 40
  quality_threshold: 4.2
  graceful_degradation: false

runtime:
  timezone: "Asia/Shanghai"
  max_parallel_tasks: 3
  approval_timeout_hours: 24
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "knowledge_base"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "acp"
  base_url: ""
  wire_api: "chat_completions"
  api_key_env: ""
  api_key: ""
  primary_model: ""
  fallback_models: []
  acp:
    agent: "codex"
    cwd: "."
    acpx_command: "C:/Users/RanchoTao/Desktop/RanchoAutoResearch/AutoResearchClaw/.venv/Scripts/acpx.cmd"
    session_name: "researchclaw-jev-system-one-map-v01"
    timeout_sec: 1800

literature_search:
  sources:
    - "openalex"
    - "arxiv"
  max_results_per_query: 12
  inter_query_delay_sec: 1.2
  openalex_email: "researchclaw@users.noreply.github.com"
  openalex_api_key_env: "OPENALEX_API_KEY"
  openalex_api_key: ""
  s2_api_key_env: "S2_API_KEY"
  s2_api_key: ""

security:
  hitl_required_stages: [9]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

experiment:
  mode: "sandbox"
  time_budget_sec: 3600
  max_iterations: 3
  metric_key: "aurc"
  metric_direction: "minimize"
  sandbox:
    python_path: "C:/Users/RanchoTao/Desktop/RanchoAutoResearch/AutoResearchClaw/.venv/Scripts/python.exe"
    gpu_required: false
    max_memory_mb: 8192
  benchmark_agent:
    enabled: false
  opencode:
    enabled: false
  figure_agent:
    enabled: false
    nano_banana_enabled: false

export:
  target_conference: "ccf_a_tbd"
  authors: "Anonymous"
  bib_file: "references"

prompts:
  custom_file: ""
  extra_prompts:
    topic_init: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"
    problem_decompose: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"
    search_strategy: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"
    literature_collect: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"
    literature_screen: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"
    knowledge_extract: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"
    synthesis: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"
    hypothesis_gen: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"
    experiment_design: "run_inputs/jev-system-one-20260921/RESEARCH_BRIEF.md"

hitl:
  enabled: true
  mode: "custom"
  cost_budget_usd: 8.0
  notifications:
    on_pause: true
    on_quality_drop: true
    on_error: true
    channels: ["terminal"]
  timeouts:
    default_human_timeout_sec: 86400
    auto_proceed_on_timeout: false
  stage_policies:
    "9":
      require_approval: true
      allow_edit_output: true
      allow_inject_prompt: true
      enable_collaboration: true
      auto_proceed_on_timeout: false
