project:
  name: "claim-evidence-verification-autonomous-research-20260824"
  mode: "full-auto"

research:
  topic: "Claim-Evidence Verification for Autonomous AI Research"
  domains:
    - "machine learning"
    - "autonomous research agents"
    - "scientific claim verification"
    - "evidence verification"
    - "LLM as a judge"
    - "automated peer review"
    - "AI safety and reliability"
  daily_paper_count: 40
  quality_threshold: 4.0
  graceful_degradation: false

runtime:
  timezone: "Asia/Shanghai"
  max_parallel_tasks: 3
  approval_timeout_hours: 8
  retry_limit: 2

notifications:
  channel: "console"
  target: ""
  on_stage_start: true
  on_stage_fail: true
  on_gate_required: true

knowledge_base:
  backend: "markdown"
  root: "knowledge_base/claim-evidence-verification-20260824"

openclaw_bridge:
  use_cron: false
  use_message: false
  use_memory: false
  use_sessions_spawn: false
  use_web_fetch: false
  use_browser: false

llm:
  provider: "acp"
  base_url: ""
  wire_api: "chat_completions"
  api_key_env: ""
  api_key: ""
  primary_model: ""
  fallback_models: []
  acp:
    agent: "codex"
    cwd: "."
    acpx_command: "C:/Users/RanchoTao/Desktop/RanchoAutoResearch/AutoResearchClaw/.venv/Scripts/acpx.cmd"
    session_name: "researchclaw-claim-evidence-verification-20260824-v1"
    timeout_sec: 1800

literature_search:
  sources: ["openalex", "arxiv"]
  max_results_per_query: 15
  inter_query_delay_sec: 1.0
  openalex_email: "researchclaw@users.noreply.github.com"
  openalex_api_key_env: "OPENALEX_API_KEY"
  openalex_api_key: ""
  s2_api_key_env: "S2_API_KEY"
  s2_api_key: ""

security:
  hitl_required_stages: [5, 9]
  allow_publish_without_approval: false
  redact_sensitive_logs: true

experiment:
  mode: "sandbox"
  time_budget_sec: 14400
  max_iterations: 2
  max_refine_duration_sec: 14400
  metric_key: "false_support_rate"
  metric_direction: "minimize"
  sandbox:
    python_path: "C:/Users/RanchoTao/Desktop/RanchoAutoResearch/AutoResearchClaw/.venv/Scripts/python.exe"
    gpu_required: false
    max_memory_mb: 6144
  code_agent:
    enabled: true
    architecture_planning: true
    sequential_generation: true
    hard_validation: true
    hard_validation_max_repairs: 2
    exec_fix_max_iterations: 2
    exec_fix_timeout_sec: 120
    tree_search_enabled: false
    review_max_rounds: 1
  benchmark_agent:
    enabled: true
    enable_hf_search: true
    max_hf_results: 10
    enable_web_search: true
    max_web_results: 5
    web_search_min_local: 3
    tier_limit: 2
    min_benchmarks: 1
    min_baselines: 3
    prefer_cached: true
    max_iterations: 1
  opencode:
    enabled: false
  figure_agent:
    enabled: false
    nano_banana_enabled: false
  repair:
    enabled: true
    max_cycles: 1
    min_completion_rate: 0.75
    min_conditions: 4
    use_opencode: false
    timeout_sec_per_cycle: 900
  cli_agent:
    provider: "llm"
    max_budget_usd: 5.0
    timeout_sec: 1200

export:
  target_conference: "iclr_2027"
  authors: "Anonymous"
  bib_file: "references"

prompts:
  custom_file: ""
  extra_prompts:
    topic_init: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    problem_decompose: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    search_strategy: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    literature_collect: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    literature_screen: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    knowledge_extract: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    synthesis: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    hypothesis_gen: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    experiment_design: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    code_generation: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    resource_planning: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    result_analysis: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"
    research_decision: "run_inputs/claim-evidence-verification-20260824/RESEARCH_BRIEF.md"

hitl:
  enabled: true
  mode: "custom"
  cost_budget_usd: 5.0
  notifications:
    on_pause: true
    on_quality_drop: true
    on_error: true
    channels: ["terminal"]
  timeouts:
    default_human_timeout_sec: 60
    auto_proceed_on_timeout: true
  stage_policies:
    "5":
      require_approval: true
      auto_proceed_on_timeout: true
    "9":
      require_approval: true
      auto_proceed_on_timeout: true
