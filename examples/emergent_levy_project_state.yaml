  - id: thm_01M17NGE4J47G2WXB5A1F5T3S3
    project_id: proj_01M17ZEH007KG04GE8NASNVVG4
    title: "Aligned exact-Pareto clock ECF estimator transfer"
    statement: >-
      For a fixed beta in (0,1), exact iid Pareto microscopic blocks, exact
      aligned sampling, an independent Brownian clock, and two fixed distinct
      positive ECF frequencies, the prelimit alpha estimator has the same
      shrinking-Delta Gaussian limit as the effective symmetric stable model.
    formal_statement: >-
      If epsilon_n -> 0, Delta_n -> 0, m_n=Delta_n/epsilon_n is integral and
      diverges, N_n Delta_n -> infinity, and sqrt(N_n Delta_n)
      [epsilon_n+epsilon_n^((1-beta)/beta)] -> 0, then
      sqrt(N_n Delta_n)(alpha_hat_n-2 beta) converges to Normal(0,V_0), where
      0<V_0<infinity is defined in ROUND4_THEOREM_V1.md.
    status: PROVED_BY_AGENT
    assumptions:
      - "beta is fixed in (0,1), and alpha=2 beta."
      - "Rewards are iid with exact survival P(A>x)=x^(-beta) for x>=1."
      - "Brownian motion is independent of the complete reward sequence."
      - "Microscopic blocks and observation boundaries start at zero and align exactly."
      - "The two ECF frequencies are fixed, positive, finite, and distinct."
      - "The full joint epsilon-Delta-N regime in the formal statement holds."
    dependencies: []
    required_lemmas: []
    proof_attempts:
      - run_01M17NGE4M5RTX4XNSYD1E0BED
      - run_01M17NGE4N903BF3D5GBR1QR1A
      - run_01M17NGE4TS7CV6999KHZ8Y0BM
    counterexample_attempts:
      - run_01M17NGE4Q8NSVS8T8D79TK8CH
      - run_01M17NGE4WKTPYZ8N62VQX7GZG
    known_gaps:
      - "Human mathematical verification remains unreviewed."
      - "No result is established for unaligned or random-phase sampling."
      - "No result is established for dependent blocks or general regularly varying tails."
      - "No result is established for growing frequencies or full experiment equivalence."
    references: []
