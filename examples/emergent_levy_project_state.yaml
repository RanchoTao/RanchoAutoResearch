    project_id: proj_01M17ZEH007KG04GE8NASNVVG4
    statement: >-
      The corrected canonical T4 has an asymptotic population target 2 beta,
      a one-dependent finite-q score CLT with variance
      V(q,mu)=q s(q,mu)^{-2} d Omega(q,mu)d^T, uniform fixed-parameter
      O(1/q) recovery of V_0, and an explicit finite-resolution family showing
      failure of a universal phase-free same-law variance.
    claim_type: THEORETICAL
    scope: >-
      Exact Pareto iid microscopic clock, q>=1 branch, fixed beta and fixed
      ECF frequencies, explicit phase-measure convergence; q<1 and finite-q
      general regular variation are excluded.
