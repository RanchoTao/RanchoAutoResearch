  - id: thm_BBNWBJEGWZJZXG1QHEAQ970000
    project_id: proj_01M17ZEH007KG04GE8NASNVVG4
    title: "Unaligned deterministic-grid exact-Pareto ECF estimator transfer"
    statement: >-
      Strict observation/block alignment can be removed: arbitrary deterministic
      microscopic phase and nonintegral Delta/epsilon yield the same stable ECF
      estimator limit and variance V_0 when Delta/epsilon diverges.
    formal_statement: >-
      Fix beta in (0,1), alpha=2 beta, exact iid Pareto rewards, independent
      Brownian subordination, and fixed 0<u_1<u_2. If epsilon_n -> 0,
      Delta_n -> 0, Delta_n/epsilon_n -> infinity, N_n Delta_n -> infinity,
      and sqrt(N_n Delta_n)[epsilon_n+epsilon_n^((1-beta)/beta)] -> 0,
      then for every deterministic row-wise initial phase and fractional ratio,
      sqrt(N_n Delta_n)(alpha_hat_n-alpha) converges to Normal(0,V_0), with
      the same V_0 as aligned T1 and direct stable observations.
    status: PROVED_BY_AGENT
    assumptions:
