theorems:
  - id: thm_01M18400000000000000000001
    project_id: proj_01M17ZEH007KG04GE8NASNVVG4
    title: "Canonical T4 finite-resolution inference theorem"
    statement: >-
      In the corrected exact-Pareto q>=1 regime, the frozen two-frequency ECF
      estimator is consistent for alpha=2 beta and satisfies a phase-aware CLT
      with V(q,mu)=q s(q,mu)^{-2} d Omega(q,mu)d^T. For fixed beta and
      frequencies, sup_mu |V(q,mu)-V_0| is O(1/q), while explicit locked phases
      at every integer resolution disprove universal finite-q phase-free
      same-law variance transfer.
    formal_statement: "See round10_t4_decisive_gate/ROUND10_T4_CANONICAL.md."
    status: PROVED_BY_AGENT
    assumptions:
      - "beta is fixed in (0,1), alpha=2 beta, and rewards are iid exact Pareto."
      - "The Brownian motion is independent of the microscopic clock."
      - "epsilon_n and Delta_n vanish, q_n=Delta_n/epsilon_n converges to q>=1, and q_n>=1 eventually."
      - "N_n Delta_n diverges and the explicit exact-Pareto centering rate vanishes after sqrt(N_n Delta_n) scaling."
      - "The empirical phase measures mu_n converge weakly to an admissible mu."
      - "The two ECF frequencies are fixed, positive, finite, and distinct."
    dependencies: []
    required_lemmas: []
    proof_attempts:
      - run_01M18400000000000000000002
    counterexample_attempts:
      - run_01M18400000000000000000003
    known_gaps:
      - "Human mathematical verification remains UNREVIEWED."
      - "q<1 and approach to q=1 from below are outside the theorem."
      - "Finite-q general regular variation is outside the theorem."
      - "No uniformity is claimed near beta endpoints or for changing frequencies."
      - "The necessity result is a phase-family counterexample at integer q, not pointwise failure for every finite real q."
    references: []
    supporting_claims: [claim_01M18400000000000000000001]
    confidence: null
    review_status: AGENT_REVIEWED
    human_verified: false
    human_verification: UNREVIEWED
    created_at: "2026-08-30T21:30:00+08:00"
    updated_at: "2026-08-30T21:30:00+08:00"

