seeds: [11, 23, 37, 53, 71]
generators: [markov, recurrence4]
conditions:
  - all_unique
  - duplicate_random
  - duplicate_spaced
  - duplicate_massed_early
  - duplicate_massed_middle
  - duplicate_massed_late
data:
  vocab_size: 32
  sequence_length: 32
  total_exposures: 60000
  duplicate_fraction: 0.20
  repeated_subset_size: 500
  validation_sequences: 4096
model:
  d_model: 64
  n_layers: 3
  n_heads: 4
  d_mlp: 192
training:
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.01
  gradient_clip: 1.0
output_dir: experiments/mvp

