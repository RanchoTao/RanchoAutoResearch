seed: 11
task:
  family: relation_chain
  depths: [1, 2, 3, 4, 5]
  entities: 16
  edges: 7
  train_examples: 100000
  validation_examples: 5000
  circuit_examples_per_depth: 256
model:
  d_model: 128
  n_layers: 10
  n_heads: 4
  d_mlp: 384
  dropout: 0.0
training:
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.10
  max_epochs: 80
  patience: 20
  accuracy_target: 0.95
circuit:
  fidelity_fraction: 0.90
  corruptions_per_example: 1
  random_controls: 50
output_dir: experiments/mvp_seed11
